<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="阳明印章">
  <defs>
    <linearGradient id="sealRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#9C2A1E"/>
    </linearGradient>
    <filter id="sealGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2">
        <feFuncA type="linear" slope="0.10"/>
      </feComponentTransfer>
      <feComposite in="g2" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- 印身：略带圆角的方印 -->
  <rect x="6" y="6" width="108" height="108" rx="16" fill="url(#sealRed)"/>
  <!-- 内框 -->
  <rect x="15" y="15" width="90" height="90" rx="9" fill="none" stroke="#F4EFE6" stroke-width="2.4" stroke-opacity="0.92"/>
  <!-- 双线内框（细） -->
  <rect x="20.5" y="20.5" width="79" height="79" rx="6" fill="none" stroke="#F4EFE6" stroke-width="0.9" stroke-opacity="0.55"/>

  <!-- 阳  -->
  <g fill="#F7F2E9">
    <path d="M30 32.5h22v3.2H30z"/>
    <path d="M39.4 30.2h3.4v26.6h-3.4z"/>
    <path d="M28.4 40.6h7.2v3.2h-7.2z"/>
    <path d="M46.6 40.6h7.2v3.2h-7.2z"/>
    <!-- 日 部 -->
    <path d="M31.6 48.4h19v3h-19z"/>
    <path d="M31.6 57.4h19v3h-19z"/>
    <path d="M31.6 48.4h3.2v12h-3.2z"/>
    <path d="M47.4 48.4h3.2v12h-3.2z"/>
    <!-- 勿 部（简化为两撇） -->
    <path d="M52.6 47.2q6.6 1.4 8.4 5.2l-2.9 1.6q-1.6-3.2-6.6-4.4z"/>
    <path d="M50.4 56.4q7.2 1.2 9.6 4.6l-2.7 1.8q-2.2-3-7.8-4z"/>
  </g>

  <!-- 明 -->
  <g fill="#F7F2E9">
    <!-- 日 部 -->
    <path d="M64 32h14v3h-14z"/>
    <path d="M64 32h3.2v14.4H64z"/>
    <path d="M74.8 32H78v14.4h-3.2z"/>
    <path d="M64 43.4h14v3H64z"/>
    <path d="M69.4 36.2h3.2v8.4h-3.2z"/>
    <!-- 月 部 -->
    <path d="M81.4 32.4q3.4 0 3.4 3.4v13.4l-3.1 1.1V36.6q0-.9-.9-.9h-4.6v-3.3z"/>
    <path d="M80.6 41.2h5.6v3h-5.6z"/>
    <path d="M80.6 49.4h5.6v3h-5.6z"/>
    <path d="M80.6 57.6h5.6v3h-5.6z"/>
    <path d="M83.4 41.2h3v19.4h-3z"/>
  </g>

  <!-- 落款小字寓意线：三横一竖的「王」 -->
  <g fill="#F7F2E9" opacity="0.95">
    <path d="M52.6 74.6h14.8v2.6H52.6z"/>
    <path d="M54.8 80.6h10.4v2.6H54.8z"/>
    <path d="M52 86.6h16v2.6H52z"/>
    <path d="M58.7 73h2.6v17.6h-2.6z"/>
  </g>

  <rect x="6" y="6" width="108" height="108" rx="16" fill="none" filter="url(#sealGrain)" opacity="0.5"/>
</svg>
