name: Build APK

# 如果你是把「整个项目目录」推到 GitHub（而不是只推 android/），
# 用的是这个 workflow。它比 android/ 里那个多一步：先跑 sync-web.sh，
# 保证 APK 里的网页资源一定和 yangming-schedule/ 源码一致。
#
# 只推 android/ 的话用 android/.github/workflows/build-apk.yml。

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.2
        run: |
          curl -sSL -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.2/bin" >> "$GITHUB_PATH"

      # 兜底：runner 默认已接受许可，但镜像偶尔会变。已接受时是 no-op。
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            echo "已确认 SDK 许可（$SDKMANAGER）"
          else
            echo "没找到 sdkmanager，跳过"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      # 关键的防漏一步：从源码重新同步，杜绝「改了网页忘了同步 assets」导致的白屏包
      # 用 bash 显式调用，不依赖仓库里的可执行位
      - name: Sync web sources into Android assets
        run: bash ./android/sync-web.sh

      - name: Audit the corpus
        run: |
          if [ -f yangming-schedule/tools/audit-corpus.js ] && command -v node >/dev/null 2>&1; then
            node yangming-schedule/tools/audit-corpus.js
          else
            echo "跳过（缺 node 或校对工具）"
          fi

      - name: Verify the corpus is not empty
        run: |
          n=$(grep -h -c "^ *{ id:" android/app/src/main/assets/www/js/data/quotes-0*.js | awk '{s+=$1} END {print s}')
          echo "语料条数：$n"
          if [ "$n" -lt 400 ]; then echo "::error::语料不足 400 条"; exit 1; fi

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yangming-schedule-debug
          path: out/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: Write summary
        if: always()
        run: |
          {
            echo "## 构建结果"
            if ls out/*.apk >/dev/null 2>&1; then
              echo ""
              ls -lh out/*.apk | awk '{print "- `" $9 "` — " $5}'
              echo ""
              echo "**下载位置**：本页面拉到最下面 → Artifacts → \`yangming-schedule-debug\`"
            else
              echo ""
              echo "构建失败，请查看上方步骤日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
